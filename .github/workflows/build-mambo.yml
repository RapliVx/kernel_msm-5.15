name: "Build Eva With Mambo (Custom Repo)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"
  # --- CUSTOM BUILDER IDENTITY ---
  LINUX_COMPILE_BY: "RapliVx"
  LINUX_COMPILE_HOST: "MaybeALinux"

on:
  workflow_dispatch:
    inputs:
      REPO_URL:
        description: 'URL Repository Kernel (Contoh: https://github.com/User/kernel_xiaomi_xun)'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      REPO_BRANCH:
        description: 'Branch Repository'
        required: true
        default: 'android13-5.15-lts'
      DIR_NAME:
        description: 'Nama Folder Source (Contoh: common, clo, atau xun)'
        required: true
        default: 'common'

jobs:
  build-kernels:
    name: "🚀 Build ${{ github.event.inputs.DIR_NAME }} [Mambo: ${{ matrix.ksu }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ksu: [true, false]

    env:
      WORK_DIR: ${{ github.workspace }}
      KERNEL_LOC_DIR: "kernel_workspace"
      KERNEL_NAME: ${{ github.event.inputs.DIR_NAME }}
      KERNEL_REPO: ${{ github.event.inputs.REPO_URL }}
      KERNEL_BRANCH: ${{ github.event.inputs.REPO_BRANCH }}
      DEFCONFIG_NAME: "gki_defconfig"

    steps:
      - name: "✨ Initialize MAGI System"
        run: |
          SRC_NAME="${{ github.event.inputs.DIR_NAME }}"
          SRC_LOWER=$(echo "$SRC_NAME" | tr '[:upper:]' '[:lower:]')
           
          if [ "${{ matrix.ksu }}" == "true" ]; then
            echo "ENABLE_KSU=true" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Image.${SRC_LOWER}.mambo" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=Eva-Kernel-${SRC_NAME}-MamboSU" >> $GITHUB_ENV
          else
            echo "ENABLE_KSU=false" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Image.${SRC_LOWER}.vanilla" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=Eva-Kernel-${SRC_NAME}-Vanilla" >> $GITHUB_ENV
          fi

      - name: "🛠️ Preparing GeoFront (Workspace)"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: "🧬 Cloning Custom Source Code"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          echo "Cloning form: ${{ env.KERNEL_REPO }}"
          echo "Branch: ${{ env.KERNEL_BRANCH }}"
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Syncing AOSP & Toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
           
          rm -rf .repo common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
           
          if [ -f "${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants" ]; then
              sed -i \
               -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
               -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
               ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          fi
           
          if [ -f "${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki" ]; then
              sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true
          fi

      - name: "🔧 Injecting MamboSU + SUSFS"
        if: matrix.ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu
           
          echo "📦 Installing MamboSU..."
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/refs/heads/susfs-rksu-master/kernel/setup.sh" | bash -s susfs-rksu-master
           
          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
           
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
           
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed — copying files manually"
          fi

          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ] && cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
           
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/
          fi
           
          rm -rf susfs4ksu
          [ ! -L "drivers/kernelsu" ] && ln -sf ../KernelSU drivers/kernelsu
           
          cat >> "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          # CONFIG_KSU_SUSFS_TRY_UMOUNT is not set
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: "⚙️ Synchronizing Core Configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          EOF

      - name: "🔨 Building Eva Unit"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Inject Host & User identity for the build
          export KBUILD_BUILD_USER="${{ env.LINUX_COMPILE_BY }}"
          export KBUILD_BUILD_HOST="${{ env.LINUX_COMPILE_HOST }}"
          
          LTO=thin \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📁 Securing Kernel Image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Uploading to Central Dogma"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "📦 Deploying EVA Packages"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Retrieving Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📦 Packaging Release"
        run: |
          set -e
          git clone --depth=1 https://github.com/RapliVx/Anykernel3_GKI.git -b topaz AnyKernel3
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          # Membuat Banner Evangelion
          cat > AnyKernel3/banner << 'EOF'
          ╔═════════════════════════════════════════════════════╗
          ║                                                     ║
          ║            E V A N G E L I O N   K E R N E L      ║
          ║                                                     ║
          ║               KSU: MamboSU + sUsFS                  ║
          ║               Pilot: @ErOneSoul                     ║
          ╠═════════════════════════════════════════════════════╣
          ║                                                     ║
          ║  "God's in his Heaven. All's right with the world." ║
          ║                                                     ║
          ╚═════════════════════════════════════════════════════╝
          Initializing EVA System...
          EOF

          ZIP_NAME="EvaCore-Mambo-Custom_${{ github.run_number }}_$(date +'%Y%m%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "⬆️ Release to Github"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "EVA-MAMBO-CUSTOM-RELEASE"
