name: "Build Eva With Mambo (Custom Repo)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"
  LINUX_COMPILE_BY: "${{ github.actor }}"
  LINUX_COMPILE_HOST: "GitHub-Actions"

on:
  workflow_dispatch:
    inputs:
      REPO_URL:
        description: 'URL Repository Kernel'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      REPO_BRANCH:
        description: 'Branch Repository'
        required: true
        default: 'android13-5.15-lts'
      DIR_NAME:
        description: 'Nama Folder Source'
        required: true
        default: 'common'
      LOCAL_VERSION:
        description: 'Nama Local Version (Contoh: -Eva-v1)'
        required: false
        default: '-EvaCORE'

jobs:
  build-kernels:
    name: "🚀 Build ${{ github.event.inputs.DIR_NAME }} [KSU: ${{ matrix.ksu }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ksu: [true, false]

    env:
      WORK_DIR: ${{ github.workspace }}
      KERNEL_LOC_DIR: "kernel_workspace"
      KERNEL_NAME: ${{ github.event.inputs.DIR_NAME }}
      KERNEL_REPO: ${{ github.event.inputs.REPO_URL }}
      KERNEL_BRANCH: ${{ github.event.inputs.REPO_BRANCH }}
      DEFCONFIG_NAME: "gki_defconfig"

    steps:
      - name: "✨ Initialize Build Variables"
        run: |
          SRC_NAME="${{ github.event.inputs.DIR_NAME }}"
          SRC_LOWER=$(echo "$SRC_NAME" | tr '[:upper:]' '[:lower:]')
            
          if [ "${{ matrix.ksu }}" == "true" ]; then
            echo "ENABLE_KSU=true" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Image.${SRC_LOWER}.ksu" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=Eva-Kernel-${SRC_NAME}-KSU" >> $GITHUB_ENV
          else
            echo "ENABLE_KSU=false" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Image.${SRC_LOWER}.vanilla" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=Eva-Kernel-${SRC_NAME}-Vanilla" >> $GITHUB_ENV
          fi

      - name: "🛠️ Preparing Build Environment"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            repo rsync aria2 git build-essential

          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions"

      - name: "🧬 Cloning Custom Kernel Source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          echo "⬇️ Cloning from: ${{ env.KERNEL_REPO }}"
          echo "🌿 Branch: ${{ env.KERNEL_BRANCH }}"
          
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Syncing AOSP & Toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j$(nproc)
          rm -rf .repo common

          echo "⬇️ Downloading Clang r547379..."
          CLANG_DIR="prebuilts/clang/host/linux-x86/clang-r547379"
          mkdir -p "$CLANG_DIR"
          
          aria2c -x 16 -s 16 -o clang.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          tar -xzf clang.tar.gz -C "$CLANG_DIR"
          rm -f clang.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
            
          CONSTANTS_FILE="${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants"
          if [ -f "$CONSTANTS_FILE" ]; then
              sed -i -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
                     -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' "$CONSTANTS_FILE"
          fi
            
          GKI_CONFIG="${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki"
          if [ -f "$GKI_CONFIG" ]; then
              sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' "$GKI_CONFIG" || true
          fi

      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # Inject Custom Local Version
          echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.LOCAL_VERSION }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"

      - name: "🔧 Injecting KernelSU (xxksu)"
        if: matrix.ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu
            
          echo "📦 Installing KernelSU (xxksu)..."
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s xxksu
          
          [ ! -L "drivers/kernelsu" ] && ln -sf ../KernelSU drivers/kernelsu

          cat >> "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: "⚙️ Synchronizing Core Configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          EOF

      - name: "🔨 Building Eva Unit"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          export KBUILD_BUILD_USER="${{ env.LINUX_COMPILE_BY }}"
          export KBUILD_BUILD_HOST="${{ env.LINUX_COMPILE_HOST }}"
          
          echo "🚀 Starting build for ${{ env.KERNEL_NAME }}..."
          
          LTO=thin \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📁 Securing Kernel Image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Uploading to Central Dogma"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "📦 Deploying EVA AIO Package"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Retrieving Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "🕒 Prepare Release Variables"
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date +'%H:%M')" >> $GITHUB_ENV
          echo "BUILD_DATE=$(TZ=Asia/Jakarta date +'%Y%m%d')" >> $GITHUB_ENV

      - name: "📦 Packaging AIO Release"
        run: |
          set -e
          # 1. Clone AnyKernel3
          git clone --depth=1 https://github.com/RapliVx/Anykernel3.git -b GKI AnyKernel3
          
          # 2. Hapus sisa Image bawaan repo
          rm -f AnyKernel3/Image* AnyKernel3/dtb* AnyKernel3/dtbo*

          # 3. Copy Kernel (Selector Mode)
          echo "📂 Copying KSU Kernel..."
          find ./artifacts -name "*.ksu" -exec cp {} AnyKernel3/Image-ksu \;
          
          echo "📂 Copying Vanilla Kernel..."
          find ./artifacts -name "*.vanilla" -exec cp {} AnyKernel3/Image-vanilla \;

          # 4. Buat Banner
          cat > AnyKernel3/banner << 'EOF'
          ╔═════════════════════════════════════════════════════╗
          ║                                                     ║
          ║            E V A N G E L I O N   K E R N E L      ║
          ║                                                     ║
          ║            [ AIO SELECTOR EDITION ]                 ║
          ║               Pilot: ${{ github.actor }}            ║
          ╠═════════════════════════════════════════════════════╣
          ║                                                     ║
          ║  "God's in his Heaven. All's right with the world." ║
          ║                                                     ║
          ╚═════════════════════════════════════════════════════╝
          Initializing EVA System...
          EOF

          # 5. Compress & MD5
          ZIP_NAME="EvaCore-AIO-${{ env.BUILD_DATE }}.zip"
          
          echo "🗜️ Compressing package..."
          pushd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git .git/* .gitignore README.md *placeholder
          popd
          
          # Generate MD5 & Size
          MD5=$(md5sum "$ZIP_NAME" | cut -d ' ' -f 1)
          SIZE=$(du -h "$ZIP_NAME" | cut -f1)
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "MD5_SUM=$MD5" >> $GITHUB_ENV
          echo "FILE_SIZE=$SIZE" >> $GITHUB_ENV
          
          echo "✅ Package Created: $ZIP_NAME ($SIZE)"
          echo "🔐 MD5: $MD5"

      - name: "⬆️ Release to Github"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "EVA-CUSTOM-${{ github.run_number }}"
          name: "EVA Unit Build: #${{ github.run_number }}"
          body: |
            ## 🧬 EvaCORE LOG // BUILD #${{ github.run_number }}
            
            > *"God's in his Heaven. All's right with the world."*
            
            ### 📊 Synchronization Data
            | Parameter | Status |
            | :--- | :--- |
            | **📅 Date** | ${{ env.BUILD_DATE }} |
            | **⏰ Time** | ${{ env.BUILD_TIME }} WIB |
            | **👤 Pilot** | @${{ github.actor }} |
            | **⚙️ Type** | **AIO (Selector Mode)** |
            | **🏷️ Ver** | `${{ github.event.inputs.LOCAL_VERSION }}` |
            | **⚖️ Size** | ${{ env.FILE_SIZE }} |
            | **🔐 MD5** | `${{ env.MD5_SUM }}` |

            ### 📂 Source Material
            ```yaml
            Repository : ${{ github.event.inputs.REPO_URL }}
            Branch     : ${{ github.event.inputs.REPO_BRANCH }}
            Target Dir : ${{ github.event.inputs.DIR_NAME }}
            Local Ver  : ${{ github.event.inputs.LOCAL_VERSION }}
            ```

            ### ⚠️ Deployment Instructions
            1. Download the **ZIP** file below.
            2. Reboot to **Recovery (TWRP/OFRP)**.
            3. Flash the file.
            4. **Follow the On-Screen Menu:**
               - 🔊 **Vol Up** for **KernelSU**
               - 🔉 **Vol Down** for **Vanilla**
