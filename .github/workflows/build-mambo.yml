name: "ProjectEVA: MAMBOSU // SUSFS"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build-kernels:
    name: "🛡️ EVA-UNIT: ${{ matrix.kernel.name }} // LAUNCH"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "UNIT-01 (GKI)"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-ProjectEVA-01-GKI"
            output_name: "Image.gki.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
          - name: "UNIT-02 (CLO)"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-ProjectEVA-02-CLO"
            output_name: "Image.clo.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
          - name: "DUMMY-PLUG (GKI-NoKSU)"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-ProjectEVA-DUMMY-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
          - name: "DUMMY-PLUG (CLO-NoKSU)"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-ProjectEVA-DUMMY-CLO"
            output_name: "Image.clo.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "⬢ [SYSTEM_START] :: GEOFRONT_INIT"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: "⬢ [DATA_SYNC] :: SOURCE_CODE_RETRIEVAL"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "⬢ [LCL_INJECTION] :: AOSP_ENVIRONMENT_SYNC"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          rm -rf .repo
          rm -rf common

          # Custom Clang
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Cleanup
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          # Config Update
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "⬢ [SYNCHRONIZATION] :: CONFIG_PATCH_MATRIX"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"

      - name: "☢️ [CODE_777] :: MAMBOSU + SUSFS PROTOCOL"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -e
          
          # Cleanup
          rm -rf ./KernelSU ./drivers/kernelsu ./MamboSU
          
          # 1. Prepare SUSFS Drivers (Kernel Side)
          echo "📦 [SUSFS_SYSTEM] :: RETRIEVING DRIVERS..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          # Apply SUSFS Kernel Patch
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$SUSFS_PATCH" ]; then
             patch -p1 --forward < "$SUSFS_PATCH" || echo "⚠️ AT-FIELD: Patch conflict ignored."
          fi
          
          # Install SUSFS Headers/Source
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h || true
          
          # 2. Install MamboSU (RapliVx)
          echo "⚠️ INITIATING MAMBOSU (SUSFS VARIANT)..."
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          
          # Symlink check (Mambo setup usually creates KernelSU dir, ensuring symlink)
          if [ ! -L "drivers/kernelsu" ]; then
             ln -sf ../KernelSU drivers/kernelsu
          fi

          # 3. Apply Configs
          cat >> "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=n
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          rm -rf susfs4ksu
          echo "✅ MAMBOSU + SUSFS: SYNCHRONIZED."

      - name: "⬢ [OPTIMIZATION] :: REMOVING_LIMITERS"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: "⚔️ [OPERATION_START] :: COMPILATION_PROCESS"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=thin \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "⬢ [OUTPUT_HANDLING] :: ARTIFACT_EXTRACTION"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 [DATA_UPLOAD] :: CLOUD_PRESERVATION"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "🧬 HUMAN_INSTRUMENTALITY :: FINAL_PACKAGING"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 [RETRIEVAL] :: ARTIFACT_COLLECTION"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📦 [COMPLETION] :: CREATE_RELEASE_PACKAGE"
        run: |
          set -e

          # Clone AnyKernel3
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3

          # Copy kernel images
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          # Create Custom ASCII Banner
          cat > AnyKernel3/banner << 'EOF'
          ⢠⡤⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
          ⠀⠈⠪⡑⢄⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣀⢀⠀⠀⠀⠀⠀
          ⠀⠀⠀⠈⠢⡉⠢⡀⠀⠀⠀⠀⠀⠀⠀⡠⠄⠒⣲⠠⣲⠅⠀⣻⠀⠀⠀⠀⠀
          ⠀⠀⠀⠀⠀⠀⠀⢌⠀⢄⠀⠀⠀⢀⣾⡴⡆⢠⢛⢗⡽⠃⣼⠁⠀⠀⠀⠀⠀
          ⠀⠀⠀⠀⠀⠀⠀⠀⠑⢤⢓⠤⠔⠁⠀⣸⠤⠊⢲⣿⠀⢰⡈⠀⠀⠀⠀⠀⠀
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠑⢄⠇⣤⣾⠮⢹⡰⡕⢉⠙⡙⠀⠀⠀⠀⠀⠀⠀
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣞⣋⢥⣱⢻⡭⣭⣶⢋⢂⠙⢗⡍⠉⠰⠀⠀
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠁⠃⠖⠀⣿⣷⣌⢫⢸⠎⠀⠀⢙⡆⠀⢃⡀
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢾⠟⠼⡞⠀⠉⠙⠄⠀⡘⢦⡀⡸
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢣⡰⢸⡇⠀⠀⠀⠀⠀⠈⠑⠵⠇
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢓⡘⡁⠀⠀⠀⠀⠀⠀⠀⠀⠀
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠸⢱⢃⠀⠀⠀⠀⠀⠀⠀⠀⠀
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠂⠋⠀⠀⠀⠀⠀⠀⠀⠀⠀

          ProjectEVA // MAMBOSU PROTOCOL
          EOF

          # Create ZIP
          ZIP_NAME="ProjectEVA-MAMBOSU_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ INSTRUMENTALITY COMPLETE: $ZIP_NAME"

      - name: "⬆️ [DEPLOY] :: GITHUB_RELEASE"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "ProjectEVA-MAMBOSU"

      - name: "📡 [MAGI_SYSTEM] :: BROADCAST_STATUS"
        if: success()
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/ProjectEVA-MAMBOSU"
          MESSAGE="<b>🚨 MAGI SYSTEM // PRIORITY ALERT 🚨</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>OPERATION:</b> ProjectEVA MAMBOSU%0A"
          MESSAGE="${MESSAGE}<b>STATUS:</b> <pre>MISSION ACCOMPLISHED</pre>%0A%0A"
          MESSAGE="${MESSAGE}<b>📦 CONTAINMENT UNIT:</b>%0A"
          MESSAGE="${MESSAGE}<code>${{ env.ZIP_NAME }}</code>%0A%0A"
          MESSAGE="${MESSAGE}<b>📊 SYNCHRONIZATION REPORT:</b>%0A"
          MESSAGE="${MESSAGE}⬢ UNIT-01: GKI + MAMBOSU + SUSFS%0A"
          MESSAGE="${MESSAGE}⬢ UNIT-02: CLO + MAMBOSU + SUSFS%0A"
          MESSAGE="${MESSAGE}⬢ DUMMY: NO-KSU VARIANTS%0A%0A"
          MESSAGE="${MESSAGE}🔗 <a href='${RELEASE_URL}'>ACCESS TERMINAL DOGMA</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true

      - name: "💔 [THIRD_IMPACT] :: SYSTEM_FAILURE"
        if: failure()
        run: |
          MESSAGE="<b>⚠️ EMERGENCY // THIRD IMPACT IMMINENT ⚠️</b>%0A%0A"
          MESSAGE="${MESSAGE}<b>SYSTEM STATE:</b> CRITICAL FAILURE%0A"
          MESSAGE="${MESSAGE}<b>DIAGNOSTIC:</b> PATTERN BLUE DETECTED%0A%0A"
          MESSAGE="${MESSAGE}🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>VIEW FLIGHT RECORDER</a>"
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"
